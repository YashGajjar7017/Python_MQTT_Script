# MQTT Client Settings from MQTTBox
broker:
  name: "866738083619898"
  host: "rms.iotscada-pmsg.com"             # MQTT Host from MQTTBox
  port: 8883                               # Default MQTTS/TLS Port
  protocol: "mqtts"
  mqtt_version: "3.1.1"                    # "Broker is MQTT v3.1.1 compliant?: Yes"
  client_id: "84e738ec-179a-4546-88af-cc3ba679d08d" # MQTT Client Id from MQTTBox
  append_timestamp: false                  # Set false for exact client ID, or true if MQTTBox is also open
  clean_session: false                     # "Clean Session?: No"
  username: "test"                         # Username from MQTTBox
  password: ""                             # Auto-loaded from server_credentials.json or enter here
  keepalive: 10                            # KeepAlive (seconds) from MQTTBox
  connect_timeout: 30                      # Connect Timeout (seconds)
  reconnect_period_ms: 1000                # Reconnect Period (milliseconds)
  use_tls: true                            # Protocol: mqtts / tls
  ssl_tls_version: "Auto"                  # SSL / TLS Version: Auto
  ssl_cert_type: "CA signed server certificate"
  queue_qos_zero: true                     # Queue outgoing QoS zero messages?: Yes
  reschedule_pings: false                  # Reschedule Pings?: No

topics:
  # Primary Command & Request Topics (Server Pub -> Device Sub)
  ondemand_sub_template: "rtsg-1/ongridrooftop/{imei}/ondemand/sub"
  config_sub_template: "rtsg-1/ongridrooftop/{imei}/config/sub"
  messagekey_sub_template: "rtsg-1/ongridrooftop/{imei}/messagekey/sub"
  info_sub_template: "rtsg-1/ongridrooftop/{imei}/info/sub"

  # Telemetry & Status Response Topics (Device Pub -> Server Sub)
  data_pub_template: "rtsg-1/ongridrooftop/{imei}/data/pub"
  heartbeat_pub_template: "rtsg-1/ongridrooftop/{imei}/heartbeat/pub"
  ondemand_pub_template: "rtsg-1/ongridrooftop/{imei}/ondemand/pub"
  config_pub_template: "rtsg-1/ongridrooftop/{imei}/config/pub"
  rtevent_pub_template: "rtsg-1/ongridrooftop/{imei}/rtevent/pub"

  # Subscriptions: Subscribes to ALL topics for THIS device via wildcard suffix #
  # This guarantees 100% of packets from 866738083619898 are received, exactly like in MQTTBox!
  info_subscriptions:
    - "rtsg-1/ongridrooftop/866738083619898/#"
    - "rtsg-1/ongridrooftop/866738083619898/ondemand/pub"
    - "rtsg-1/ongridrooftop/866738083619898/data/pub"
    - "rtsg-1/ongridrooftop/866738083619898/heartbeat/pub"
    - "rtsg-1/ongridrooftop/866738083619898/config/pub"
    - "rtsg-1/ongridrooftop/866738083619898/rtevent/pub"
    - "rtsg-1/ongridrooftop/866738083619898/ondemand/sub"
    - "rtsg-1/ongridrooftop/866738083619898/config/sub"
    - "rtsg-1/ongridrooftop/866738083619898/messagekey/sub"
    - "rtsg-1/ongridrooftop/866738083619898/info/sub"

settings:
  auto_poll: false                         # Set true to automatically poll every N seconds
  poll_interval_seconds: 15
  response_timeout_seconds: 30
  payload_to_send: "asas"
  target_imei_only: true                   # Only process & print target IMEI (filters out other devices)
  rtevent_display_mode: "compact"          # "compact" = 1-line clean summary, "full" = multiline box, "silent" = no console print

registered_devices:
  - imei: "866738083619898"
    name: "Rooftop Solar Unit 866738083619898"
    device_type: "ONGRID_ROOFTOP_SOLAR"
    location: "Site Main"
    enabled: true
